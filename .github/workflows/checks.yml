name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    # CPU-only: no CUDA toolkit, no GPU, no model or Hugging Face download. Covers the CPU unit tests and a
    # byte-compile of the public Python files. The live HTTP smoke test (tests/http_smoke.py) needs a running
    # server with a GPU and is not run here.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Service runtime and test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run CPU unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Byte-compile public Python files
        shell: bash
        run: |
          set -euo pipefail
          files=$(git ls-files '*.py' | grep -v '^perso/' || true)
          if [ -z "$files" ]; then
            echo "no Python files found" >&2
            exit 1
          fi
          # shellcheck disable=SC2086
          python -m py_compile $files
